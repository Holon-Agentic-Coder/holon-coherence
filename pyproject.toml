[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "holon-coherence"
version = "0.1.0"
description = "Part of the Holon family of self-improving, fractal intent coding agents, used to optimize LLM usage."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Holon Team" }
]
keywords = [
    "ai-agents",
    "token-reduction",
    "prompt-caching",
    "llm-gateway",
    "mitmproxy",
    "context-cleaning",
    "holon",
]
dependencies = [
    "cryptography>=42.0.0",
    "mitmproxy>=12.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]


[project.scripts]
holon-coherence = "holon_coherence.cli:main"
coherence = "holon_coherence.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/holon_coherence"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "RUF",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
