[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "holon-coherence"
version = "0.1.0"
description = "Part of the Holon family of self-improving, fractal intent coding agents, used to optimize LLM usage."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [
    { name = "Holon Team" }
]
keywords = [
    "ai-agents",
    "token-reduction",
    "prompt-caching",
    "llm-gateway",
    "mitmproxy",
    "context-cleaning",
    "holon",
]
dependencies = [
    "cryptography==48.0.1",
]

[dependency-groups]
dev = [
    "mitmproxy==12.2.3",
    "pytest==9.1.1",
    "ruff==0.16.7",
    "taskipy>=1.14.1",
]


[project.scripts]
holon-coherence = "holon_coherence.cli:main"

[tool.taskipy.tasks]
test = "pytest -m 'not integration_test'"
test-docker = "pytest -m 'integration_test'"
lint = "ruff check . && ruff format --check ."
fix-ruff = "ruff check --fix . && ruff format ."
clean = "rm -rf build dist *.egg-info .pytest_cache .ruff_cache .coverage htmlcov && find . -type d -name __pycache__ -exec rm -rf {} +"


[tool.hatch.build.targets.wheel]
packages = ["src/holon_coherence"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "RUF",
    "C901",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12
max-returns = 6
max-statements = 50

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-m 'not integration_test'"
markers = [
    "integration_test: marks tests as integration tests",
]
