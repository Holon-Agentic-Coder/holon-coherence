name: Docker Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: write # Buildx GHA cache; also lists CI timing artefacts
  pull-requests: read # CI timing gate reads the acceptance label

jobs:
  docker-build:
    name: docker-build
    runs-on: ubuntu-latest

    steps:
      - name: Record job start time
        run: echo "CI_TIMING_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          keep-state: true

      - name: Expose GitHub Runtime
        uses: crazy-max/ghaction-github-runtime@v4

      - name: Build Docker image via make build-image
        run: |
          make build-image

      - name: Verify Docker image
        run: |
          docker images holon-coherence
          docker inspect holon-coherence:latest >/dev/null

      - name: CI timing gate (record)
        if: success() && github.event_name != 'pull_request'
        shell: bash
        run: |
          python3 scripts/ci_timing_gate.py record \
            --workflow "$GITHUB_WORKFLOW" --job "$GITHUB_JOB" --os "$RUNNER_OS" \
            --started-at "$CI_TIMING_STARTED_AT" --out "$RUNNER_TEMP/ci-timing" \
            --ceiling 300

      - name: CI timing gate (compare with main)
        if: success() && github.event_name == 'pull_request'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 scripts/ci_timing_gate.py compare \
            --workflow "$GITHUB_WORKFLOW" --job "$GITHUB_JOB" --os "$RUNNER_OS" \
            --started-at "$CI_TIMING_STARTED_AT" --out "$RUNNER_TEMP/ci-timing" \
            --baseline-count 5 --tolerance-percent 50 --min-delta 30 --ceiling 300 \
            --test-tolerance-percent 50 --test-min-delta 5 --test-limit 10 \
            --accept-label timing-regression-accepted --pr-number "$PR_NUMBER"

      - name: Upload CI timing record (main only)
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ci-timing-${{ github.job }}-${{ runner.os }}
          path: ${{ runner.temp }}/ci-timing/timing.json
          retention-days: 90
          if-no-files-found: warn
