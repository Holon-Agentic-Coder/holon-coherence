name: Docker Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  pull-requests: read

jobs:
  docker-build:
    name: docker-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Bookkeeping gate
        id: bookkeeping_gate
        uses: ./.github/actions/bookkeeping-gate
        with:
          job-name: docker-build

      - name: CI Timing Gate (Start)
        if: steps.bookkeeping_gate.outputs.skip != 'true'
        uses: ./.github/actions/ci-timing-gate
        with:
          phase: start

      - name: Set up QEMU
        if: steps.bookkeeping_gate.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.bookkeeping_gate.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v4
        with:
          keep-state: true

      - name: Expose GitHub Runtime
        if: steps.bookkeeping_gate.outputs.skip != 'true'
        uses: crazy-max/ghaction-github-runtime@v4

      - name: Build Docker image via make build-image
        if: steps.bookkeeping_gate.outputs.skip != 'true'
        run: |
          make build-image

      - name: Verify Docker image
        if: steps.bookkeeping_gate.outputs.skip != 'true'
        run: |
          docker images holon-coherence
          docker inspect holon-coherence:latest >/dev/null

      - name: CI timing gate (record)
        if: success() && steps.bookkeeping_gate.outputs.skip != 'true' && github.event_name != 'pull_request'
        shell: bash
        run: |
          python3 scripts/ci_timing_gate.py record \
            --workflow "$GITHUB_WORKFLOW" --job "$GITHUB_JOB" --os "$RUNNER_OS" \
            --started-at "$CI_TIMING_STARTED_AT" --out "$RUNNER_TEMP/ci-timing" \
            --ceiling 300

      - name: CI timing gate (compare with main)
        if: success() && steps.bookkeeping_gate.outputs.skip != 'true' && github.event_name == 'pull_request'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 scripts/ci_timing_gate.py compare \
            --workflow "$GITHUB_WORKFLOW" --job "$GITHUB_JOB" --os "$RUNNER_OS" \
            --started-at "$CI_TIMING_STARTED_AT" --out "$RUNNER_TEMP/ci-timing" \
            --baseline-count 5 --tolerance-percent 50 --min-delta 30 --ceiling 300 \
            --test-tolerance-percent 50 --test-min-delta 5 --test-limit 10 \
            --accept-label timing-regression-accepted --pr-number "$PR_NUMBER"

      - name: Upload CI timing record (main only)
        if: success() && steps.bookkeeping_gate.outputs.skip != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ci-timing-${{ github.job }}-${{ runner.os }}
          path: ${{ runner.temp }}/ci-timing/timing.json
          retention-days: 90
          if-no-files-found: warn
          overwrite: true

      - name: CI Timing Gate (Check <= 5 min)
        if: always() && steps.bookkeeping_gate.outputs.skip != 'true'
        uses: ./.github/actions/ci-timing-gate
        with:
          phase: check
          max-seconds: "300"
