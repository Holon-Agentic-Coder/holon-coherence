name: Test - Ledger Invariants

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  ledger-invariants:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check ledger stores cardinality
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 scripts/check_ledger_stores.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA"

      - name: Check ledger rows are append-only
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 scripts/check_ledger_rows_append_only.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA"
