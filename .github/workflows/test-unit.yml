name: Test - Unit

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read # CI timing gate lists main timing artefacts
  pull-requests: read # CI timing gate reads the acceptance label

jobs:
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Record job start time
        run: echo "CI_TIMING_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Cache conda packages
        uses: actions/cache@v4
        with:
          path: ~/conda_pkgs_dir
          key: ${{ runner.os }}-conda-${{ hashFiles('environment.yml') }}
          restore-keys: ${{ runner.os }}-conda-

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          environment-file: environment.yml
          channels: conda-forge
          auto-activate-base: false
          activate-environment: holon
          conda-remove-defaults: true
          use-only-tar-bz2: false

      - name: Run unit tests
        shell: bash -el {0}
        run: uv sync; uv run task test --junitxml="$RUNNER_TEMP/ci-timing/junit.xml"

      - name: CI timing gate (record)
        if: success() && github.event_name != 'pull_request'
        shell: bash
        run: |
          python3 scripts/ci_timing_gate.py record \
            --workflow "$GITHUB_WORKFLOW" --job "$GITHUB_JOB" --os "$RUNNER_OS" \
            --started-at "$CI_TIMING_STARTED_AT" --out "$RUNNER_TEMP/ci-timing" \
            --ceiling 300 \
            --junit "$RUNNER_TEMP/ci-timing/junit.xml"

      - name: CI timing gate (compare with main)
        if: success() && github.event_name == 'pull_request'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 scripts/ci_timing_gate.py compare \
            --workflow "$GITHUB_WORKFLOW" --job "$GITHUB_JOB" --os "$RUNNER_OS" \
            --started-at "$CI_TIMING_STARTED_AT" --out "$RUNNER_TEMP/ci-timing" \
            --baseline-count 5 --tolerance-percent 50 --min-delta 30 --ceiling 300 \
            --test-tolerance-percent 50 --test-min-delta 5 --test-limit 10 \
            --accept-label timing-regression-accepted --pr-number "$PR_NUMBER" \
            --junit "$RUNNER_TEMP/ci-timing/junit.xml"

      - name: Upload CI timing record (main only)
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ci-timing-${{ github.job }}-${{ runner.os }}
          path: ${{ runner.temp }}/ci-timing/timing.json
          retention-days: 90
          if-no-files-found: error
